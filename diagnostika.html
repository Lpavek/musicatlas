<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Spotify API Diagnostika</title>
<style>
    body {
        margin: 0;
        padding: 24px;
        background: #121212;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
    }
    h1 { color: #1db954; }
    button {
        background: #1db954;
        color: #121212;
        border: none;
        padding: 10px 20px;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;
        margin: 6px 6px 6px 0;
        font-size: 14px;
    }
    button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
    input[type=text] {
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #444;
        background: #1e1e1e;
        color: #fff;
        font-size: 14px;
        width: 200px;
    }
    .block {
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
    }
    .label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    pre {
        background: #000;
        padding: 12px;
        border-radius: 6px;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
    }
    .ok { color: #1db954; font-weight: bold; }
    .err { color: #ff6b6b; font-weight: bold; }
    .warn { color: #ffb84d; font-weight: bold; }
    a { color: #4fa8ff; }
</style>
</head>
<body>

<h1>🔍 Spotify Web API — Diagnostika</h1>
<p>Tenhle nástroj ti ukáže přesně to, co si mezi sebou posílá tvůj prohlížeč a Spotify — bez ničeho schovaného.</p>

<div class="block">
    <div class="label">Krok 1 — Client ID</div>
    <input type="text" id="clientIdInput" placeholder="Vlož Client ID z developer.spotify.com/dashboard" value="d12d1f6a79ab4d7fbdf00435566ed35d">
</div>

<div class="block">
    <div class="label">Krok 2 — Přihlášení</div>
    <div id="authStatus">Nepřihlášen.</div>
    <button id="loginBtn">Přihlásit se přes Spotify</button>
    <button id="logoutBtn">Smazat uložený token</button>
</div>

<div class="block">
    <div class="label">Krok 3 — Testovací dotazy</div>
    <button id="testProfileBtn" disabled>Test: /v1/me (profil)</button>
    <button id="testSearchBtn" disabled>Test: /v1/search?q=test</button>
    <button id="testSearchMarketBtn" disabled>Test: /v1/search s market=CZ</button>
</div>

<div class="block" id="resultsBlock" style="display:none;">
    <div class="label">Výsledek</div>
    <div id="resultSummary"></div>
    <pre id="resultBody"></pre>
</div>

<div class="block">
    <div class="label">Uložený token (info)</div>
    <pre id="tokenInfo">žádný</pre>
</div>

<script>
    const AUTH_KEY = "spotify_diag_token";
    const REDIRECT_URI = window.location.origin + window.location.pathname;

    const clientIdInput = document.getElementById('clientIdInput');
    const authStatus = document.getElementById('authStatus');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const testProfileBtn = document.getElementById('testProfileBtn');
    const testSearchBtn = document.getElementById('testSearchBtn');
    const testSearchMarketBtn = document.getElementById('testSearchMarketBtn');
    const resultsBlock = document.getElementById('resultsBlock');
    const resultSummary = document.getElementById('resultSummary');
    const resultBody = document.getElementById('resultBody');
    const tokenInfoEl = document.getElementById('tokenInfo');

    async function pkceChallenge(v) {
        const d = new TextEncoder().encode(v);
        const h = await crypto.subtle.digest("SHA-256", d);
        return btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function rand() {
        const a = new Uint8Array(64);
        crypto.getRandomValues(a);
        return btoa(String.fromCharCode(...a)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    async function login() {
        const clientId = clientIdInput.value.trim();
        if (!clientId) { alert("Vyplň Client ID"); return; }
        localStorage.setItem("diag_client_id", clientId);

        const verifier = rand();
        const challenge = await pkceChallenge(verifier);
        sessionStorage.setItem("diag_verifier", verifier);

        const p = new URLSearchParams({
            client_id: clientId,
            response_type: "code",
            redirect_uri: REDIRECT_URI,
            scope: "user-read-private user-read-email",
            code_challenge_method: "S256",
            code_challenge: challenge
        });
        location.href = "https://accounts.spotify.com/authorize?" + p;
    }

    async function finishAuth() {
        const urlParams = new URLSearchParams(location.search);
        const code = urlParams.get("code");
        const errParam = urlParams.get("error");

        if (errParam) {
            showResult("Chyba autorizace (vrátilo ji Spotify při přihlašování)", { error: errParam }, false);
            window.history.replaceState({}, document.title, window.location.pathname);
            return;
        }

        if (!code) return;

        const verifier = sessionStorage.getItem("diag_verifier");
        const clientId = localStorage.getItem("diag_client_id") || clientIdInput.value.trim();

        if (!verifier) {
            showResult("Autorizační kód byl v URL, ale chybí uložený code_verifier (asi reload staré stránky). Zkus se přihlásit znovu.", null, false);
            window.history.replaceState({}, document.title, window.location.pathname);
            return;
        }

        const p = new URLSearchParams({
            client_id: clientId,
            grant_type: "authorization_code",
            code: code,
            redirect_uri: REDIRECT_URI,
            code_verifier: verifier
        });

        try {
            const r = await fetch("https://accounts.spotify.com/api/token", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: p
            });
            const d = await r.json();

            if (r.ok && d.access_token) {
                localStorage.setItem(AUTH_KEY, JSON.stringify({
                    access_token: d.access_token,
                    refresh_token: d.refresh_token || null,
                    expires_at: Date.now() + d.expires_in * 1000,
                    scope: d.scope || ""
                }));
                showResult("Výměna kódu za token proběhla v pořádku (HTTP " + r.status + ").", d, true);
            } else {
                showResult("Výměna kódu za token SELHALA (HTTP " + r.status + "). Tohle je důležitý nález, pošli mi to.", d, false);
            }
        } catch (e) {
            showResult("Síťová výjimka při výměně kódu za token.", { message: e.message }, false);
        } finally {
            sessionStorage.removeItem("diag_verifier");
            window.history.replaceState({}, document.title, window.location.pathname);
            refreshUI();
        }
    }

    function getStoredToken() {
        return JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
    }

    function logout() {
        localStorage.removeItem(AUTH_KEY);
        refreshUI();
    }

    function refreshUI() {
        const t = getStoredToken();
        if (t && t.access_token) {
            const valid = t.expires_at > Date.now();
            authStatus.innerHTML = valid
                ? `<span class="ok">Přihlášen.</span> Token platný ${Math.round((t.expires_at - Date.now())/1000)} s. Scope: ${t.scope || '(žádný)'}`
                : `<span class="warn">Token expirovaný.</span> Přihlas se znovu.`;
            testProfileBtn.disabled = !valid;
            testSearchBtn.disabled = !valid;
            testSearchMarketBtn.disabled = !valid;
            tokenInfoEl.textContent = JSON.stringify({
                access_token_preview: t.access_token.slice(0, 12) + "...",
                expires_at: new Date(t.expires_at).toLocaleString(),
                scope: t.scope
            }, null, 2);
        } else {
            authStatus.innerHTML = "Nepřihlášen.";
            testProfileBtn.disabled = true;
            testSearchBtn.disabled = true;
            testSearchMarketBtn.disabled = true;
            tokenInfoEl.textContent = "žádný";
        }
    }

    function showResult(summaryText, bodyObj, ok) {
        resultsBlock.style.display = 'block';
        resultSummary.innerHTML = `<span class="${ok ? 'ok' : 'err'}">${summaryText}</span>`;
        resultBody.textContent = bodyObj ? JSON.stringify(bodyObj, null, 2) : "(žádné tělo odpovědi)";
    }

    async function callApi(path, label) {
        const t = getStoredToken();
        if (!t || !t.access_token) { showResult("Nejsi přihlášen.", null, false); return; }

        const url = "https://api.spotify.com" + path;
        try {
            const r = await fetch(url, { headers: { Authorization: "Bearer " + t.access_token } });
            const text = await r.text();
            let body;
            try { body = JSON.parse(text); } catch { body = text; }

            const summary = `${label}<br>URL: <code>${url}</code><br>HTTP status: <b class="${r.ok ? 'ok' : 'err'}">${r.status} ${r.statusText}</b>`;
            resultsBlock.style.display = 'block';
            resultSummary.innerHTML = summary;
            resultBody.textContent = typeof body === 'string' ? body : JSON.stringify(body, null, 2);
        } catch (e) {
            showResult(label + " — síťová výjimka", { message: e.message }, false);
        }
    }

    loginBtn.addEventListener('click', login);
    logoutBtn.addEventListener('click', logout);
    testProfileBtn.addEventListener('click', () => callApi('/v1/me', 'Test profilu (/v1/me)'));
    testSearchBtn.addEventListener('click', () => callApi('/v1/search?q=test&type=album&limit=5', 'Test hledání bez market parametru'));
    testSearchMarketBtn.addEventListener('click', () => callApi('/v1/search?q=test&type=album&limit=5&market=CZ', 'Test hledání s market=CZ'));

    finishAuth().then(refreshUI);
</script>
</body>
</html>
